[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "somnia"
version = "0.1.0"
description = "Neural Networks That Dream About Their Own Weak Spots"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.2",
    "imageio>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["somnia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
